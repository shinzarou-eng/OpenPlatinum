name: macOS

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install sdl3 meson ninja

      - name: Configure
        working-directory: cpp
        run: meson setup builddir

      - name: Build
        working-directory: cpp
        run: ninja -C builddir

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenPlatinum-macos-arm64
          path: cpp/builddir/OpenPlatinum
