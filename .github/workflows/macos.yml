name: macOS

on:
  push:
    branches: [main]
    paths:
      - 'cpp/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-13, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: brew install sdl3 meson ninja

      - name: Configure
        working-directory: cpp
        run: meson setup builddir

      - name: Build
        working-directory: cpp
        run: ninja -C builddir

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenPlatinum-macos-${{ matrix.arch }}
          path: cpp/builddir/OpenPlatinum
