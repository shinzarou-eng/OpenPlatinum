# Codemagic — build macOS + session VNC pour tester OpenPlatinum
# Pendant le build : bouton "Remote access" dans l'UI -> SSH + VNC.
# En VNC : scp la ROM, lancer le binaire, tester pour de vrai.
workflows:
  macos-build:
    name: macOS build + test
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Install deps
        script: brew install sdl3 meson ninja
      - name: Build
        script: |
          cd cpp
          meson setup builddir
          ninja -C builddir
      - name: Smoke test (boot sans ROM)
        script: |
          cd cpp/builddir
          ./OpenPlatinum --map 411 2>&1 | head -20 || true
      - name: Hold for remote access (VNC in UI)
        script: sleep 2400
    artifacts:
      - cpp/builddir/OpenPlatinum
